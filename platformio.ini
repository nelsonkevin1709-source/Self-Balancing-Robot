; ESP32 build (PlatformIO in VS Code).
;
; Each [env:...] below is one program. Pick which one to upload with the
; environment selector in the blue status bar at the bottom of VS Code
; (it says "Default (sbr)" or "env:test_imu"), then click Upload (->) and
; Serial Monitor (plug icon).
;
; The simulator is built separately with CMake: see CMakeLists.txt / README.md.

[platformio]
default_envs = test_imu

; Settings shared by every program
[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.x (the code uses its PWM functions)
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes                     ; show what you type (y / n answers)
monitor_filters = esp32_exception_decoder
build_flags = -I src -I include
lib_deps = h2zero/NimBLE-Arduino@^1.4.2
; Files every ESP32 program needs. Each env adds its own app file.
build_src_filter =
	-<*>
	+<hal/esp32/>
	+<comms/esp32/>
	+<devices/>
	+<main/esp32_main.cpp>
	+<apps/TestReport.cpp>

[env:test_imu]
build_src_filter = ${env.build_src_filter} +<apps/test_imu.cpp>

[env:test_motors]
build_src_filter = ${env.build_src_filter} +<apps/test_motors.cpp>

[env:test_ultrasonic]
build_src_filter = ${env.build_src_filter} +<apps/test_ultrasonic.cpp>

[env:test_bluetooth]
build_src_filter = ${env.build_src_filter} +<apps/test_bluetooth.cpp>

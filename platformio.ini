; BalanceBot - PlatformIO project configuration
; Everyone who opens this project gets the same board support and library
; versions from this file, so "it works on my computer" problems stay rare.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev            ; generic ESP32 - works for the ESP32-WROOM-DA module
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2   ; lightweight Bluetooth LE library

lib_ldf_mode = chain+
build_flags =
    -Wall
